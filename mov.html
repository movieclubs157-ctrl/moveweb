<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovWeb</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --bg: #08090d;
            --card: #11131a;

            --text: #ffffff;
            --muted: #9298a8;

            --accent: #7657ff;
            --accent2: #5739e8;

            --border:
                rgba(255,255,255,.08);

        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 80% 0%,
                    rgba(118,87,255,.15),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 0% 80%,
                    rgba(87,57,232,.08),
                    transparent 30%
                ),

                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 62px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(8,9,13,.82);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid var(--border);

        }


        .logo {

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -.8px;

        }


        .logo span {
            color: var(--accent);
        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding:
                32px 16px 60px;

        }


        /* =========================
           HERO
        ========================= */

        .hero {

            text-align: center;

            margin-bottom: 25px;

        }


        .hero h1 {

            font-size:
                clamp(26px, 5vw, 38px);

            line-height: 1.15;

            font-weight: 800;

            margin-bottom: 8px;

        }


        .hero p {

            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;

        }


        /* =========================
           GATE
        ========================= */

        .gate {

            max-width: 600px;

            margin: auto;

            padding: 24px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid var(--border);

            border-radius: 20px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.38);

        }


        .instruction {

            text-align: center;

            margin-bottom: 20px;

        }


        .instruction h2 {

            font-size: 20px;

            margin-bottom: 8px;

        }


        .instruction p {

            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;

        }


        /* =========================
           DIRECT LINK BUTTON
        ========================= */

        .continue-button {

            width: 100%;

            border: 0;

            border-radius: 12px;

            padding: 16px 20px;

            background:

                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(87,57,232,.25);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;

        }


        .continue-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 14px 35px
                rgba(87,57,232,.35);

        }


        .continue-button:disabled {

            cursor:
                not-allowed;

            opacity:
                .65;

            transform:
                none;

        }


        /* =========================
           COUNTDOWN
        ========================= */

        .countdown {

            display: none;

            margin-top: 20px;

            text-align: center;

            color: var(--muted);

            font-size: 13px;

        }


        .countdown strong {

            color: white;

            font-size: 18px;

        }


        .progress {

            width: 100%;

            height: 5px;

            margin-top: 12px;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(255,255,255,.08);

        }


        .progress-bar {

            width: 0%;

            height: 100%;

            background:

                linear-gradient(
                    90deg,
                    var(--accent),
                    #a794ff
                );

            transition:
                width .3s linear;

        }


        .countdown-status {

            margin-top: 9px;

            color: #686e7d;

            font-size: 11px;

        }


        /* =========================
           VIDEO SECTION
        ========================= */

        .video-section {

            display: none;

            margin-top: 30px;

            animation:
                fadeIn .4s ease;

        }


        /* =========================
           VIDEO AD
        ========================= */

        .video-ad {

            width: 100%;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid var(--border);

        }


        .ad-label {

            text-align: center;

            color: #666b79;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }


        .ad-container {

            width: 100%;

            min-height: 250px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            border-radius: 12px;

            background:
                rgba(0,0,0,.15);

            border:
                1px solid var(--border);

        }


        /* =========================
           VIDEO HEADER
        ========================= */

        .video-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 11px;

        }


        .video-header h2 {
            font-size: 17px;
        }


        .movie-id {

            color: var(--muted);

            font-size: 11px;

        }


        /* =========================
           IFRAME
        ========================= */

        .iframe-wrapper {

            position: relative;

            width: 100%;

            overflow: hidden;

            background: #000;

            border-radius: 15px;

            border:
                1px solid var(--border);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.45);

        }


        .iframe-wrapper::before {

            content: "";

            display: block;

            padding-top: 56.25%;

        }


        #movieFrame {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border: 0;

        }


        /* =========================
           ERROR
        ========================= */

        .error {

            display: none;

            text-align: center;

            padding: 40px 20px;

            border-radius: 16px;

            background:
                rgba(255,60,60,.04);

            border:
                1px solid
                rgba(255,60,60,.12);

            color: #ff9292;

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            padding: 20px;

            color: #5d6270;

            font-size: 11px;

        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                height: 58px;
            }


            .logo {
                font-size: 22px;
            }


            main {

                padding:
                    25px 12px 45px;

            }


            .hero h1 {
                font-size: 27px;
            }


            .gate {

                padding: 18px;

                border-radius: 17px;

            }


            .instruction h2 {
                font-size: 18px;
            }


            .video-ad {

                padding: 9px;

                border-radius: 11px;

            }


            .iframe-wrapper {

                border-radius: 10px;

            }

        }

    </style>

</head>

            </div>


            <div class="ad-container">


                <!-- =========================

                <script>

                    atOptions = {

                            '6b47016ceaee3ec1c6f3afdf62342da0',

<script>


    /* ==========================================
       CONFIGURATION
    ========================================== */


    /*
     * CHANGE THIS TO YOUR DIRECT LINK
     */

    const DIRECT_LINK =
        "https://labourcomparison.com/emse0dfv?key=7e4d1477af047c755cf0a11179e7f7a7";


    /*
     * Seconds to wait after clicking
     * the Continue button.
     */

    const WAIT_SECONDS = 5;


    /* ==========================================
       GET MOVIE ID
    ========================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const movieId =
        params.get("id");


    /* ==========================================
       ELEMENTS
    ========================================== */

    const gate =
        document.getElementById(
            "gate"
        );


    const error =
        document.getElementById(
            "error"
        );


    const continueButton =
        document.getElementById(
            "continueButton"
        );


    const countdown =
        document.getElementById(
            "countdown"
        );


    const seconds =
        document.getElementById(
            "seconds"
        );


    const progressBar =
        document.getElementById(
            "progressBar"
        );


    const countdownStatus =
        document.getElementById(
            "countdownStatus"
        );


    const videoSection =
        document.getElementById(
            "videoSection"
        );


    const movieFrame =
        document.getElementById(
            "movieFrame"
        );


    const movieIdElement =
        document.getElementById(
            "movieId"
        );


    /* ==========================================
       VALIDATE ID
    ========================================== */

    if (
        !movieId ||
        !/^\d+$/.test(movieId)
    ) {

        gate.style.display =
            "none";

        error.style.display =
            "block";

    }
    else {

        // movieIdElement.textContent =
        //     "ID: " + movieId;

    }


    /* ==========================================
       CONTINUE BUTTON
    ========================================== */

    continueButton.addEventListener(
        "click",
        function () {


            /*
             * Disable button immediately
             * so it cannot be clicked twice.
             */

            continueButton.disabled =
                true;


            continueButton.textContent =
                "Opening Link...";


            /*
             * Open your direct link.
             */

            if (
                DIRECT_LINK &&
                DIRECT_LINK !==
                "YOUR_DIRECT_LINK_HERE"
            ) {

                window.open(
                    DIRECT_LINK,
                    "_blank",
                    "noopener,noreferrer"
                );

            }


            /*
             * Show countdown.
             */

            countdown.style.display =
                "block";


            continueButton.style.display =
                "none";


            countdownStatus.textContent =
                "Preparing your video...";


            startCountdown();

        }
    );


    /* ==========================================
       COUNTDOWN
    ========================================== */

    let elapsed =
        0;


    let timer =
        null;


    function startCountdown() {


        if (timer) {
            return;
        }


        timer =
            setInterval(
                function () {


                    /*
                     * Pause the timer if
                     * the user leaves this page.
                     */

                    if (
                        document.hidden
                    ) {

                        countdownStatus.textContent =
                            "Return to this page to continue.";

                        return;

                    }


                    elapsed++;


                    const remaining =
                        Math.max(
                            WAIT_SECONDS -
                            elapsed,
                            0
                        );


                    seconds.textContent =
                        remaining;


                    const progress =
                        Math.min(
                            (
                                elapsed /
                                WAIT_SECONDS
                            ) * 100,
                            100
                        );


                    progressBar.style.width =
                        progress + "%";


                    countdownStatus.textContent =
                        "Preparing your video...";


                    /*
                     * Countdown finished.
                     */

                    if (
                        elapsed >=
                        WAIT_SECONDS
                    ) {

                        clearInterval(
                            timer
                        );


                        timer =
                            null;


                        showVideo();

                    }


                },
                1000
            );

    }


    /* ==========================================
       SHOW VIDEO
    ========================================== */

    function showVideo() {


        /*
         * Hide gate.
         */

        gate.style.display =
            "none";


        /*
         * Show video section.
         */

        videoSection.style.display =
            "block";


        /*
         * Build iframe URL.
         *
         * Example:
         *
         * ?id=310131
         *
         * becomes:
         *
         * https://nxsha.space/embed/movie/310131
         */

        movieFrame.src =
            "https://nxsha.space/embed/movie/" +
            encodeURIComponent(
                movieId
            );


        /*
         * Scroll to video.
         */

        setTimeout(
            function () {

                videoSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            },
            150
        );

    }


</script>
