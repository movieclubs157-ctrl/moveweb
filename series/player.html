<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Player</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="header-container">


        <a
            href="index.html"
            class="logo"
        >
            Movie<span>Hub</span>
        </a>


        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

        </nav>


    </div>

</header>



<!-- =====================================================
     MAIN PLAYER
====================================================== -->

<main class="player-main">


    <!-- BACK -->

    <a
        href="index.html"
        class="back-button"
    >
        ← Back to Movies
    </a>



    <!-- =================================================
         MOVIE DETAILS
    ================================================== -->

    <section
        id="movieDetails"
        class="movie-details"
    >

    </section>



    <!-- =================================================
         EPISODES
    ================================================== -->

    <section class="episode-section">


        <h2>
            Episodes
        </h2>


        <div
            id="episodeTabs"
            class="episode-tabs"
        >

        </div>


    </section>



    <!-- =================================================
         VIDEO PLAYER
    ================================================== -->

    <section
        id="videoPlayer"
        class="video-player"
    >


        <div class="player-message">


            <div class="player-icon">
                ▶
            </div>


            <h3>
                Select an Episode
            </h3>


            <p>
                Click an episode above to start watching.
            </p>


        </div>


    </section>


</main>



<!-- =====================================================
     FOOTER
====================================================== -->

<footer class="footer">


    <button
        id="footerToggle"
        class="footer-toggle"
    >
        Hide Advertisement
    </button>


    <div
        id="footerAd"
        class="footer-ad"
    >

        <div class="ad-box">

            Advertisement

            <small>
                Add your advertisement here
            </small>

        </div>

    </div>


    <div class="footer-bottom">

        © 2026 MovieHub

    </div>


</footer>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/movies.js"></script>

<script src="js/common.js"></script>


<script>


/* =========================================================
   GET MOVIE ID
========================================================= */

const movieId =
    getMovieId();



/* =========================================================
   FIND MOVIE
========================================================= */

const movie =
    getMovieById(movieId);



/* =========================================================
   ELEMENTS
========================================================= */

const movieDetails =
    document.getElementById(
        "movieDetails"
    );


const episodeTabs =
    document.getElementById(
        "episodeTabs"
    );


const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );



/* =========================================================
   MOVIE NOT FOUND
========================================================= */

if (!movie) {


    movieDetails.innerHTML = `

        <div class="not-found">

            <h1>
                Movie Not Found
            </h1>


            <p>
                The movie you are looking for
                does not exist.
            </p>


            <a href="index.html">
                ← Go Back
            </a>

        </div>

    `;


    episodeTabs.innerHTML = "";

}


/* =========================================================
   LOAD MOVIE
========================================================= */

else {


    /* =====================================================
       MOVIE DETAILS
    ====================================================== */


    movieDetails.innerHTML = `

        <div class="player-movie-poster">


            <img

                src="${getPoster(movie.id)}"

                alt="${movie.name}"

                onerror="
                    this.src='assets/movieimage/default.webp'
                "

            >


        </div>


        <div class="player-movie-info">


            <h1>
                ${movie.name}
            </h1>


            <p>

                ${movie.episodes.length}

                ${
                    movie.episodes.length === 1
                        ? "Episode"
                        : "Episodes"
                }

            </p>


        </div>

    `;



    /* =====================================================
       CREATE EPISODE TABS
    ====================================================== */


    movie.episodes.forEach(
        function(episode) {


            const tab =
                document.createElement(
                    "button"
                );


            tab.type =
                "button";


            tab.className =
                "episode-tab";


            tab.textContent =
                `Episode ${episode.epid}`;


            tab.addEventListener(
                "click",
                function() {

                    playEpisode(
                        episode,
                        tab
                    );

                }
            );


            episodeTabs.appendChild(
                tab
            );


        }
    );

}



/* =========================================================
   PLAY EPISODE
========================================================= */
function playEpisode(
    episode,
    clickedTab
) {

    /* =====================================================
       FIRST CLICK FOR THIS EPISODE
    ====================================================== */

    if (clickedTab.dataset.clicked !== "true") {

        /* Open random advertisement */

        openRandomDirectLink();


        /* Mark ONLY this episode as clicked */

        clickedTab.dataset.clicked = "true";


        /* Optional visual indication */

        clickedTab.classList.add(
            "ad-opened"
        );


        return;
    }


    /* =====================================================
       SECOND CLICK FOR THIS EPISODE
       LOAD ACTUAL VIDEO
    ====================================================== */


    /* Remove active state from all tabs */

    document
        .querySelectorAll(".episode-tab")
        .forEach(function(tab) {

            tab.classList.remove(
                "active"
            );

        });


    /* Mark current episode active */

    clickedTab.classList.add(
        "active"
    );


    /* =====================================================
       LOAD VIDEO
    ====================================================== */

    videoPlayer.innerHTML = `

        <div class="video-container">

            <video

                controls

                controlsList="nodownload"

                preload="metadata"

                playsinline

            >

                <source

                    src="${episode.url}"

                    type="video/mp4"

                >

                Your browser does not support
                HTML5 video.

            </video>

        </div>

    `;


    /* =====================================================
       RESET THIS EPISODE
       
       This is important.
       If the user clicks Episode 1 again later,
       it will open the advertisement again.
    ====================================================== */

    clickedTab.dataset.clicked =
        "false";


    clickedTab.classList.remove(
        "ad-opened"
    );


    /* =====================================================
       SCROLL TO VIDEO
    ====================================================== */

    videoPlayer.scrollIntoView({

        behavior: "smooth",

        block: "start"

    });

}

</script>


</body>

</html>
