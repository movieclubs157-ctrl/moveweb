<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovieHub - Movies</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="header-container">

        <a
            href="index.html"
            class="logo"
        >
            Movie<span>Hub</span>
        </a>


        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="movieSearch"
                placeholder="Search movies..."
                autocomplete="off"
            >

            <button
                type="button"
                id="clearSearch"
                class="clear-search"
            >
                ×
            </button>

        </div>


        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

        </nav>

    </div>

</header>



<!-- =====================================================
     MAIN
====================================================== -->

<main class="main-container">


    <section class="page-heading">

        <h1>
            Latest Movies
        </h1>

        <p>
            Watch your favorite movies and series
        </p>

    </section>



    <!-- MOVIE LIST -->

    <section
        id="movieList"
        class="movie-grid"
    >

    </section>


</main>



<!-- =====================================================
     FOOTER
====================================================== -->

<footer class="footer">


    <button
        id="footerToggle"
        class="footer-toggle"
    >
        Hide Advertisement
    </button>


    <div
        id="footerAd"
        class="footer-ad"
    >

        <div class="ad-box">

            Advertisement

            <small>
                Add your advertisement here
            </small>

        </div>

    </div>


    <div class="footer-bottom">

        © 2026 MovieHub

    </div>


</footer>



<!-- =====================================================
     JAVASCRIPT
     
     IMPORTANT:
     movies.js MUST load before this page's script.
====================================================== -->

<script src="js/movies.js"></script>

<script src="js/common.js"></script>


<script>


/* =========================================================
   MOVIE LIST
========================================================= */

const movieList =
    document.getElementById("movieList");


const movieSearch =
    document.getElementById("movieSearch");


const clearSearch =
    document.getElementById("clearSearch");


/* =========================================================
   DISPLAY MOVIES
========================================================= */

function displayMovies(movieArray) {

    movieList.innerHTML = "";


    /* No results */

    if (movieArray.length === 0) {

        movieList.innerHTML = `

            <div class="no-results">

                <div class="no-results-icon">
                    🔍
                </div>

                <h2>
                    No movies found
                </h2>

                <p>
                    Try searching with another movie name.
                </p>

            </div>

        `;

        return;
    }


    /* Create movie cards */

    movieArray.forEach(function(movie) {

        const card =
            document.createElement("article");


        card.className =
            "movie-card";


        card.innerHTML = `

            <div class="poster-wrapper">

                <img

                    src="${getPoster(movie.id)}"

                    alt="${movie.name}"

                    class="movie-poster"

                    onerror="
                        this.src='assets/movieimage/default.webp'
                    "

                >


                <a

                    href="player.html?id=${movie.id}"

                    class="play-overlay"

                >

                    <span class="play-icon">
                        ▶
                    </span>

                </a>

            </div>


            <div class="movie-info">

                <h3>
                    ${movie.name}
                </h3>


                <p>

                    ${movie.episodes.length}

                    ${
                        movie.episodes.length === 1
                            ? "Episode"
                            : "Episodes"
                    }

                </p>

            </div>

        `;


        movieList.appendChild(card);

    });

}


/* =========================================================
   INITIAL LOAD
========================================================= */

displayMovies(movies);


/* =========================================================
   SEARCH MOVIES
========================================================= */

movieSearch.addEventListener(
    "input",
    function() {

        const searchText =
            movieSearch.value
                .trim()
                .toLowerCase();


        /* Show/hide clear button */

        if (searchText.length > 0) {

            clearSearch.classList.add(
                "show"
            );

        } else {

            clearSearch.classList.remove(
                "show"
            );

        }


        /* Show all movies */

        if (searchText === "") {

            displayMovies(movies);

            return;

        }


        /* Filter movies */

        const filteredMovies =
            movies.filter(
                function(movie) {

                    return movie.name
                        .toLowerCase()
                        .includes(searchText);

                }
            );


        displayMovies(
            filteredMovies
        );

    }
);


/* =========================================================
   CLEAR SEARCH
========================================================= */

clearSearch.addEventListener(
    "click",
    function() {

        movieSearch.value = "";

        clearSearch.classList.remove(
            "show"
        );

        displayMovies(
            movies
        );

        movieSearch.focus();

    }
);

</script>


</body>

</html>
